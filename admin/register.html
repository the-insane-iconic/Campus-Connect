<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=../login/?tab=register" />
  <title>Redirecting to Store Registration — Campus Connect</title>
  <script>
    const search = window.location.search ? window.location.search + '&tab=register' : '?tab=register';
    window.location.replace('../login/' + search + window.location.hash);
  </script>
</head>
<body>
  <p>Redirecting to <a href="../login/?tab=register">Campus Connect Store Registration</a>...</p>
</body>
</html>
