<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Store — UniMall</title>
  <meta name="description" content="Browse products, hours, and info for this campus store." />
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" type="image/png" href="favicon.png" />
  
  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/store.css">
</head>
<body>

<div class="desktop-wrapper">

  <!-- SIDEBAR FOR DESKTOP -->
  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <div class="sidebar-brand">
      <img src="favicon.png" alt="Campus Connect" class="sidebar-app-logo" />
      <div class="header-brand-text">
        <div class="sidebar-wordmark">Uni<span>Mall</span></div>
        <div class="sidebar-tagline">Your Campus, Closer.</div>
      </div>
    </div>
    <nav class="sidebar-nav" aria-label="Site navigation">
      <div class="sidebar-section-label">Discover</div>
      <a href="index.html" class="sidebar-item" id="sb-home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="index.html?view=stores" class="sidebar-item active" id="sb-stores" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Stores
      </a>
      <div class="sidebar-section-label">My Activity</div>
      <a href="index.html?view=orders" class="sidebar-item" id="sb-orders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Orders
      </a>
      <a href="index.html?view=cart" class="sidebar-item" id="sb-cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart
        <span class="sidebar-badge" id="sb-cart-badge" style="display:none">0</span>
      </a>
      <a href="index.html?view=profile" class="sidebar-item" id="sb-profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html?view=profile" class="sidebar-profile" id="sb-profile-footer" aria-label="View profile">
        <div class="sidebar-avatar" id="sidebarAvatar"><span style="font-weight:800;font-size:14px;color:#ffffff;line-height:1;">S</span></div>
        <div class="sidebar-profile-info">
          <div class="sidebar-profile-name" id="sidebarProfileName">Campus Student</div>
          <div class="sidebar-profile-role" id="sidebarProfileRole">Campus Account</div>
        </div>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="app" id="store-main">
    <div class="store-page" id="store-page-root">

      <!-- HERO (filled by JS) -->
      <div class="store-hero" id="store-hero">
        <img class="store-hero-img" id="store-hero-img" src="" alt="" />
        <div class="store-hero-overlay"></div>
        <button class="hero-btn hero-btn-back" id="hero-back-btn" aria-label="Go back">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="hero-btn hero-btn-fav" id="hero-fav-btn" aria-label="Toggle favourite">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <!-- INFO SHEET -->
      <div class="store-info-sheet" id="store-info-sheet">
        <div class="store-info-top">
          <div class="store-logo-wrap" id="store-logo-wrap">🏪</div>
          <div class="store-info-text">
            <h1 class="store-name-heading" id="store-name-heading">Loading…</h1>
            <div class="store-categories-line" id="store-categories-line"></div>
            <div class="store-status-row">
              <span class="store-open-badge" id="store-open-badge"><span class="status-dot"></span> Open</span>
              <span class="store-closes-text" id="store-closes-text"></span>
            </div>
            <div class="store-location-row" id="store-location-row">
              <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>
              <span id="store-location-text"></span>
            </div>
          </div>
        </div>
        <p class="store-description" id="store-description"></p>
      </div>

      <!-- TABS -->
      <div class="store-tabs" id="store-tabs">
        <button class="store-tab active" id="tab-products" data-tab="products">Products</button>
        <button class="store-tab" id="tab-about" data-tab="about">About</button>
        <button class="store-tab" id="tab-reviews" data-tab="reviews">Reviews</button>
      </div>

      <!-- PRODUCTS PANEL -->
      <div class="tab-panel active" id="panel-products">
        <div class="products-panel-header">
          <h3>Products</h3>
          <div class="store-search-wrap">
            <div class="store-search-box" id="store-search-box">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
              <input type="search" id="store-search-input" placeholder="Search products…" autocomplete="off" aria-label="Search products" />
              <button class="store-search-close" id="store-search-close" aria-label="Close search">×</button>
            </div>
            <button class="store-search-toggle" id="store-search-toggle" aria-label="Search products">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
            </button>
          </div>
        </div>
        <div class="store-products-grid" id="store-products-grid"></div>
      </div>

      <!-- ABOUT PANEL -->
      <div class="tab-panel" id="panel-about">
        <div class="about-panel">
          <p class="about-description" id="about-description"></p>
          <div class="about-info-card" id="about-info-card"></div>
          <div class="about-gallery-title">Gallery</div>
          <div class="about-gallery" id="about-gallery"></div>
        </div>
        <div class="recommended-section" id="about-recommended"></div>
      </div>

      <!-- REVIEWS PANEL -->
      <div class="tab-panel" id="panel-reviews">
        <div class="reviews-panel">
          <div class="reviews-summary-card" id="reviews-summary"></div>
          <div class="write-review-btn-wrap">
            <button class="btn-write-review" id="btn-write-review">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Write a Review
            </button>
          </div>
          <div id="reviews-list"></div>
        </div>
        <div class="recommended-section" id="reviews-recommended"></div>
      </div>

    </div><!-- /store-page-root -->

    <!-- BOTTOM NAV — unchanged global nav -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-item" id="nav-home" aria-label="Home">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>
      <a href="index.html?view=stores" class="nav-item active" id="nav-stores" aria-label="Stores" aria-current="page">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </div>
        <span class="nav-label">Stores</span>
      </a>
      <a href="index.html?view=orders" class="nav-item" id="nav-orders" aria-label="Orders">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
        </div>
        <span class="nav-label">Orders</span>
      </a>
      <a href="index.html?view=cart" class="nav-item" id="nav-cart" aria-label="Cart">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span class="nav-badge" id="nav-cart-badge" aria-label="0 items in cart" style="display:none">0</span>
        </div>
        <span class="nav-label">Cart</span>
      </a>
      <a href="index.html?view=profile" class="nav-item" id="nav-profile" aria-label="Profile">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Profile</span>
      </a>
    </nav>
  </main>
</div><!-- /desktop-wrapper -->

<!-- REVIEW WRITE MODAL -->
<div class="review-modal-backdrop" id="review-modal-backdrop">
  <div class="review-modal" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
    <div class="review-modal-handle"></div>
    <h3 id="review-modal-title">Write a Review</h3>
    <div class="review-star-select" id="review-star-select" role="group" aria-label="Select rating"></div>
    <textarea class="review-textarea" id="review-textarea" placeholder="Share your experience at this store…" maxlength="500"></textarea>
    <div class="review-modal-actions">
      <button class="btn-review-cancel" id="btn-review-cancel">Cancel</button>
      <button class="btn-review-submit" id="btn-review-submit">Submit Review</button>
    </div>
  </div>
</div>

<!-- MAP OVERLAY -->
<div class="map-overlay-backdrop" id="map-overlay-backdrop">
  <div class="map-overlay" role="dialog" aria-modal="true" aria-label="Store location">
    <div class="map-overlay-handle"></div>
    <h3 id="map-store-label-title">Store Location</h3>
    <div class="map-visual">
      <div class="map-grid"></div>
      <div class="map-store-pin">
        <div class="map-pin-circle">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="map-store-label" id="map-store-name-label">Store</div>
      </div>
    </div>
    <div class="map-info-list" id="map-info-list"></div>
  </div>
</div>

<!-- PRODUCT DETAIL QUICK-VIEW MODAL -->
<div class="product-modal-backdrop" id="product-detail-modal-backdrop" aria-hidden="true">
  <div class="product-detail-modal" role="dialog" aria-modal="true" aria-labelledby="modal-prod-name">
    <button class="product-modal-close" id="product-modal-close-btn" aria-label="Close product view">×</button>
    <div class="product-modal-img-wrap">
      <img id="modal-prod-img" src="" alt="Product photo" />
      <span class="product-modal-badge" id="modal-prod-stock-badge"></span>
    </div>
    <div class="product-modal-content">
      <div class="product-modal-header">
        <h3 class="product-modal-title" id="modal-prod-name"></h3>
        <div class="product-modal-price" id="modal-prod-price"></div>
      </div>
      <div class="product-modal-store" id="modal-prod-store"></div>
      <div class="product-modal-desc-section">
        <div class="product-modal-desc-heading">About this item</div>
        <p class="product-modal-desc" id="modal-prod-desc"></p>
      </div>
      <div class="product-modal-actions">
        <button class="btn-product-add" id="modal-add-to-cart-btn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="ssd-yay-toast" id="ssd-yay-toast">
  <div class="ssd-yay-toast-icon">🛍️</div>
  <div class="ssd-yay-toast-text">
    <div class="ssd-yay-toast-title">Yay! Added to cart ✨</div>
    <div class="ssd-yay-toast-sub" id="ssd-toast-name"></div>
  </div>
  <a href="index.html?view=cart" class="ssd-yay-toast-link">View Cart →</a>
</div>
<div class="ssd-simple-toast" id="ssd-simple-toast"></div>

<script src="js/config.js"></script>
<script src="js/user-manager.js"></script>
<script src="js/sound.js"></script>
<script src="js/store.js"></script>
<script src="js/native-bridge.js"></script>

</body>
</html>
